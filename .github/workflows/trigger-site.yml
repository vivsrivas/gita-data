# in vivsrivas/gita-data/.github/workflows/trigger-site.yml
name: Trigger site rebuild
on:
  push:
    branches: ["main"]
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site repo build
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.SITE_DEPLOY_TOKEN }}" \
          https://api.github.com/repos/vivsrivas/gita-site/actions/workflows/deploy.yml/dispatches \
          -d '{"ref":"main"}'
